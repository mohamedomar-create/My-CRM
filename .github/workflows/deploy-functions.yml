# Deploys the server functions to Supabase whenever they change on main.
# Needs the repository secret SUPABASE_ACCESS_TOKEN or SUPABASE_ACCESS_TOKEN_1 (Supabase → Account → Access Tokens),
# created with Edge Functions write permission.
name: deploy server functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Either secret name works (GitHub can't rename a secret once it's created).
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN_1 }}
      PROJECT_REF: npnhoywlxidojqoijqdu
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings → Secrets and variables → Actions) to deploy server functions."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api
          done
