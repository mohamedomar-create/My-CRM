# Supabase CLI settings used by the deploy workflow.
project_id = "npnhoywlxidojqoijqdu"

[functions.command]
# The gateway checks the login token; the function then checks membership and rights itself.
verify_jwt = true

[functions.join]
# People joining from an invitation link aren't signed in yet; the function itself requires a valid, open invitation.
verify_jwt = false

[functions.scheduler]
# Called by the nightly database job, which has no login; the function checks the database-held key itself.
verify_jwt = false
