# Supabase CLI settings used by the deploy workflow.
project_id = "npnhoywlxidojqoijqdu"

[functions.command]
# The gateway checks the login token; the function then checks membership and rights itself.
verify_jwt = true

[functions.join]
# People joining from an invitation link aren't signed in yet; the function itself requires a valid, open invitation.
verify_jwt = false

[functions.scheduler]
# Called by the nightly database job, which has no login; the function checks the database-held key itself.
verify_jwt = false

[functions.billing]
# Paymob's payment notices have no login; the function checks their HMAC signature. Checkout checks the login itself.
verify_jwt = false

[functions.quote]
# Customers open a shared quotation without a login; the function requires a link whose secret matches a sent quotation.
verify_jwt = false

[functions.api]
# Other systems call the public API with an API key, not a login; the function checks the key (its hash) itself.
verify_jwt = false

[functions.whatsapp]
# Meta calls it without a login (checked by the company's verify token and app-secret signature); sends check the login itself.
verify_jwt = false

[functions.ask]
# The gateway checks the login token; the function then checks membership itself.
verify_jwt = true
